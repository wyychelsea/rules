# 必读！！！
# 此配置为覆写配置模板，不含节点以及订阅配置，不知道用途的不要用。
# 节点信息由sub-store自动填写

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true

external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed   ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  respect-rules: true
  enhanced-mode: redir-host # 切换为真实 IP 模式
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# 测速公共模板
speed: &speed {type: url-test, include-all: true, url: https://www.gstatic.com/generate_204, interval: 300, tolerance: 50, lazy: true}
 
# 出站策略
proxy-groups:
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择, DIRECT]}
  - {name: 📌 手动选择, type: select, include-all: true}
  - {name: ▶️ YouTube, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择, DIRECT]}
  - {name: 🍀 Google, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择, DIRECT]}
  - {name: 🤖 AI, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择, DIRECT]}
  - {name: 👨🏿‍💻 GitHub, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择, DIRECT]}
  - {name: Ⓜ️ 微软Bing, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择, DIRECT]}
  - {name: ☁️️ OneDrive, type: select, proxies: [DIRECT, 🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择]}
  - {name: Ⓜ️ 微软服务, type: select, proxies: [DIRECT, 🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择]}
  - {name: 📲 Telegram, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择, DIRECT]}
  - {name: 🍿 NETFLIX, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择, DIRECT]}
  - {name: 🎮 Steam, type: select, proxies: [DIRECT, 🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择]}
  - {name: 🍎 苹果服务, type: select, proxies: [DIRECT, 🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🦥 懒人, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 📌 手动选择, DIRECT]}
  - {name: 🦥 懒人, <<: *speed, filter: "懒人"}
  - {name: ♻️ 自动选择, <<: *speed, filter: "^((?!(DIRECT)).)*$"}
  - {name: 🇭🇰 香港节点, <<: *speed, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: 🇺🇲 美国节点, <<: *speed, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: 🇯🇵 日本节点, <<: *speed, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: 🇸🇬 狮城节点, <<: *speed, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|韩|日|美)).)*$"}



