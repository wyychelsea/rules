  - {name: 🇦🇷阿根廷, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)(阿根廷|Argentina|\bAR\b|\bARG\b)"}
  - {name: 🇱🇰斯里兰卡, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)(斯里兰卡|Sri Lanka|\bLK\b|\bLKA\b)"}
  - {name: 🇳🇬尼日利亚, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?i)(尼日利亚|Nigeria|\bNG\b|\bNGA\b)"}


# 规则匹配
rules:
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
#  - RULE-SET,google_ip,🔴🟡🔵🟢谷歌
#  - RULE-SET,apple_ip,🍎苹果服务
#  - RULE-SET,telegram_ip,💬Telegram
#  - RULE-SET,netflix_ip,🎥Netflix
#  - RULE-SET,cn!_domain,🌍国外
#  - RULE-SET,cn_domain,🌏国内
  - RULE-SET,cn_ip,DIRECT
  - MATCH,🐟漏网之鱼

